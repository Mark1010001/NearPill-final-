map "$status:$uri" $nearpill_cache_control {
  ~^(200|206|304):/assets/ "public, max-age=31536000, immutable";
  ~^(200):/(robots\.txt|sitemap\.xml)$ "public, max-age=3600";
  default "no-store";
}

# Customer app routes that answer 200. Any other /app/... path is a genuine 404 (the app still
# shows its own "Page unavailable" screen). Keep in sync with the <Routes> in
# web/src/features/customer/CustomerApp.tsx.
map $uri $nearpill_known_app_route {
  default 0;
  ~^/app/?$ 1;
  ~^/app/(welcome|search|pharmacies|map|assistant|forgot-password|sign-in|cart|checkout|orders|profile|settings|help|notifications)/?$ 1;
  ~^/app/pharmacies/[^/]+/?$ 1;
  ~^/app/pharmacies/[^/]+/medicines/[^/]+/?$ 1;
  ~^/app/profile/orders/?$ 1;
}

# Client-side routes that answer 200 with the app shell. Everything else under
# location / is a genuine 404 (still rendered by the SPA's "Page not found" screen).
# Keep in sync with SITE_PATHS and PORTAL_PATHS in web/src/app/App.tsx.
map $uri $nearpill_known_route {
  default 0;
  ~^/$ 1;
  ~^/(features|partners|about|contact|policies)/?$ 1;
  ~^/site(/|$) 1;
  ~^/(portal|dashboard|pharmacies|orders|catalog|subscriptions|reports|staff|customers|stock-submissions|partner)(/|$) 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Cache-Control $nearpill_cache_control always;

  location /assets/ {
    try_files $uri =404;
  }

  # The customer website (/app/) is the only part that shows a map and reads the visitor's location, so only it gets:
  #  - geolocation allowed for itself (the portal keeps it off);
  #  - Google Maps JavaScript API and OpenStreetMap tile sources (Maps injects <style>, so style-src needs 'unsafe-inline' here);
  #  - an origin-only Referer to Google, which the browser Maps key's HTTP-referrer restriction needs.
  # add_header does not inherit into a location that sets its own, so every header is repeated.
  location ~ ^/app(/|$) {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://maps.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.googleusercontent.com https://tile.openstreetmap.org; connect-src 'self' https://*.googleapis.com https://*.google.com https://*.gstatic.com; font-src 'self' https://fonts.gstatic.com; worker-src blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control $nearpill_cache_control always;
    try_files $uri @app_index;
  }

  # A try_files fallback to /index.html would re-enter location / and lose the headers above.
  location @app_index {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://maps.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.googleusercontent.com https://tile.openstreetmap.org; connect-src 'self' https://*.googleapis.com https://*.google.com https://*.gstatic.com; font-src 'self' https://fonts.gstatic.com; worker-src blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control $nearpill_cache_control always;
    error_page 404 =404 @app_404;
    if ($nearpill_known_app_route = 0) { return 404; }
    rewrite ^ /index.html break;
  }

  # Unknown /app/... paths: the same app shell with the app headers, but a real 404 status.
  location @app_404 {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://maps.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.googleusercontent.com https://tile.openstreetmap.org; connect-src 'self' https://*.googleapis.com https://*.google.com https://*.gstatic.com; font-src 'self' https://fonts.gstatic.com; worker-src blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control $nearpill_cache_control always;
    rewrite ^ /index.html break;
  }


  location / {
    try_files $uri $uri/ @site;
  }

  # Known site and portal routes get the SPA shell with 200. Any other path gets the same
  # shell (so React renders "Page not found") but with a real 404 status. The server-level
  # headers above are inherited because this location sets none of its own.
  location @site {
    error_page 404 =404 /index.html;
    if ($nearpill_known_route = 0) { return 404; }
    rewrite ^ /index.html break;
  }
}
