name: Database keep-alive

# Calls the deployed API health check, which runs SELECT 1 against the database.
# That counts as database activity, so the free Supabase project is not paused
# for inactivity. Set the repository variable HEALTH_URL, for example
# https://nearpill-api.onrender.com/api/v1/health

on:
  schedule:
    # Monday and Thursday at 02:00 UTC (10:00 Manila). Twice a week keeps
    # a safe margin inside Supabase's 7-day inactivity window.
    - cron: '0 2 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check API and database
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "HEALTH_URL is not set. Add it under Settings, Secrets and variables, Actions, Variables."
            exit 1
          fi
          # Retries cover a cold start; the job fails (and GitHub emails you) if the API stays down.
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 20 --retry-all-errors \
            --max-time 60 "$HEALTH_URL"
